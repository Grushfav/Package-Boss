# Render Blueprint — Dashboard > Blueprints > Sync after pushing changes.
#
# SPA routing on Render static sites: URLs without a trailing slash (/rates) can
# return an empty 200 body unless you redirect them or run serve -s (Node web).
# Option A (recommended): Node web service below — serve -s rewrites all paths.
# Option B: Keep static site — use staticPublishPath + routes (see comments).

services:
  # --- Option A: Node web with SPA fallback (recommended) ---
  - type: web
    name: package-boss-frontend
    runtime: node
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production

  # --- Option B: Static site (uncomment and disable Option A if you prefer CDN) ---
