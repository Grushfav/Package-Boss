# Render Blueprint — sync this file in the Render dashboard (Blueprint > Sync).
# Direct loads of /rates, /login, etc. need either the rewrite below OR spa-fallback.mjs
# (runs in npm run build and writes route/index.html copies into frontend/dist).

services:
  - type: web
    name: package-boss-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
