# Render Blueprint — Dashboard > Blueprints > Sync after pushing changes.
#
# Frontend SPA routing: npm run build runs scripts/spa-fallback.mjs, which copies
# index.html to dist/<route>/index.html for every client route. Render static sites
# serve those as real HTML — no dashboard rewrite rules needed.
#
# Do NOT add /* -> /index.html rewrites on Render static; they can return empty
# 200 bodies for paths like /rates and /login.

services:
  - type: web
    name: package-boss-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: WHATSAPP_PROVIDER
        value: console

  - type: web
    name: package-boss-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
